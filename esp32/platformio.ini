[platformio]
src_dir = .firmware
; Optional gitignored overrides (e.g. WiFi password); silently skipped if absent.
extra_configs = platformio_local.ini

[env:m5stack-atom]
platform = espressif32
board = m5stack-atom
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
build_flags =
    -D BOARD_M5STACK_ATOM
    -D CAN_DRIVER_TWAI
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    Links2004/WebSockets@^2.4.0

[env:m5stack-atom-swap-pins]
platform = espressif32
board = m5stack-atom
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
build_flags =
    -D BOARD_M5STACK_ATOM
    -D CAN_DRIVER_TWAI
    -D PIN_CAN_TX=19
    -D PIN_CAN_RX=22
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    Links2004/WebSockets@^2.4.0

; Shared build flags for the Matrix env — referenced from this file and from
; the optional gitignored platformio_local.ini, avoiding self-recursive merges
; when local overrides need to append to the env's build_flags.
[common-atom-matrix]
build_flags =
    -D BOARD_M5STACK_ATOM
    -D BOARD_M5STACK_ATOM_MATRIX
    -D CAN_DRIVER_TWAI
    -D LED_COUNT=25
    ; M5Stack ATOM Matrix front face button is on GPIO 39 (not GPIO 0, which
    ; is the side BOOT button). GPIO 39 is RTC-capable for EXT0 deep-sleep
    ; wake and is not a strapping pin, so wake-by-press is reliable. The pin
    ; has no internal pull-up but the M5Stack PCB provides an external one.
    -D PIN_BUTTON=39

[env:m5stack-atom-matrix]
platform = espressif32
board = m5stack-atom
framework = arduino
monitor_speed = 115200
build_flags = ${common-atom-matrix.build_flags}
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    Links2004/WebSockets@^2.4.0

[env:esp32-mcp2515]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
build_flags =
    -D BOARD_ESP32_GENERIC
    -D CAN_DRIVER_MCP2515
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    autowp/autowp-mcp2515@^1.3.0
    Links2004/WebSockets@^2.4.0

[env:esp32-lilygo]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
build_flags =
    -D BOARD_LILYGO
    -D CAN_DRIVER_TWAI
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    Links2004/WebSockets@^2.4.0

[env:waveshare-s3-can]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.flash_size = 8MB
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608

build_flags =
    -D BOARD_WAVESHARE_S3
    -D CAN_DRIVER_TWAI
    -D PIN_CAN_TX=15
    -D PIN_CAN_RX=16
    -D PIN_LED=46
    -D PIN_BUTTON=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    Links2004/WebSockets@^2.4.0

; LILYGO T-2CAN V1.0 — ESP32-S3 + MCP2515 (Can A, SPI) + TWAI (Can B, GPIO 6/7).
; Per LilyGO pin_config.h: MCP2515 CS=10, SCK=12, MOSI=11, MISO=13, INT=8;
; TWAI TX=7, RX=6. Both buses run simultaneously via CAN_DRIVER_DUAL.
; Note: the Fd V1.0 variant ships MCP2518FD on the SPI side and is NOT
; supported by this env — only T-2CAN V1.0 (MCP2515) works as-is.
[env:t-2can-v1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB

build_flags =
    -D BOARD_LILYGO_T2CAN
    -D CAN_DRIVER_DUAL
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    autowp/autowp-mcp2515@^1.3.0
    Links2004/WebSockets@^2.4.0
